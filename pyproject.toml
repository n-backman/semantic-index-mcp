[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-index-mcp"
version = "0.2.0"
requires-python = ">=3.11"

[project.scripts]
semantic-index = "semantic_index.cli:main"

[project.entry-points."semantic_index.plugins"]
swift = "semantic_index.plugins.swift_plugin:SwiftPlugin"
python = "semantic_index.plugins.python_plugin:PythonPlugin"
typescript = "semantic_index.plugins.typescript_plugin:TypeScriptPlugin"
